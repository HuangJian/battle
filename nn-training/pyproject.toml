[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battle2-nn-training"
version = "0.1.0"
description = "Battle City Web - NN player AI training workspace (PyTorch)"
requires-python = ">=3.10,<3.14"
# torch 刻意不在主依赖里：它只存在于下方互斥的 dependency-groups 变体中，由
# bootstrap.py 按机器探测结果选一个装。
#
# 为什么：把 torch 写进主依赖又不配 index，Linux/Windows 上 pip 会从 PyPI 拉
# 默认 CUDA 构建（连带 nvidia-* 依赖，~3GB）—— 与原来的 CPU 口径正面冲突。
# 为什么用 dependency-groups 而不是 optional-dependencies：后者会被 setuptools
# 消费，`pip install .[cpu]` 会无视 [tool.uv.sources] 从 PyPI 拉 CUDA 构建，
# 等于把同一个坑换个地方再踩一次；dependency-groups（PEP 735）只有 uv 认，
# setuptools 完全无视。详见 plan/python-env-bootstrap-and-device.md §3.2。
dependencies = ["numpy>=2.1.3", "pydantic>=2.13"]

# dev 工具链（PEP 735）
[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "pytest-xdist>=3.6", # 三个入口（门禁 / Makefile / task.py）的 pytest `-n` 并行依赖
  "pytest-timeout>=2.3", # task.py / nn-python-gate.sh 的 `--timeout=60`（**秒**）依赖
]

# torch 变体：互斥，须且只须选一个。变体名 → index 映射见 [tool.uv.sources]，
# 选择逻辑在 bootstrap.py。
#
# 变体清单是 2026-09-04 实测 download.pytorch.org 得出的（针对 torch 2.7.1）：
#   cpu / cu118 / cu126 / cu128 / xpu → Win + Linux 有构建
#   rocm6.3                            → 仅 Linux
#   cu124 / cu130                      → 无 2.7.1 构建（属其它 torch 版本），不设
# macOS 无 GPU 变体 → Darwin 上一律用 torch-cpu（Apple Silicon 的 MPS 由 PyPI
# 原生 wheel 提供，无需特殊 index）。
torch-cpu = ["torch==2.7.1"]
torch-cu118 = ["torch==2.7.1"]
torch-cu126 = ["torch==2.7.1"]
torch-cu128 = ["torch==2.7.1"]
# 注意：triton 只随 Linux wheel 发布，故带 sys_platform 标记——否则 universal
# resolution 在 Windows split 上找不到 wheel 会直接失败。
torch-rocm = ["torch==2.7.1", "pytorch-triton-rocm==3.3.1 ; sys_platform == 'linux'"]
torch-xpu = ["torch==2.7.1", "pytorch-triton-xpu==3.3.1 ; sys_platform == 'linux'"]

# ---------------------------------------------------------------------------
# uv — 环境与变体解析
# ---------------------------------------------------------------------------
[tool.uv]
# system = 优先用机器上已有的解释器（满足 requires-python 即可），没有才回退到
# uv 托管的下载版。实测（2026-09-04）：设成 managed 时 uv 会用 3.13.12 把本机
# 现役 venv（pyenv 3.10.5 + torch 2.7.1+cpu）整个 "Would replace project
# environment" 重建一遍——纯属无谓破坏。requires-python 已把范围钉在
# 3.10–3.13，用系统解释器完全够，冷机器上没 python 时仍会自动下载托管的。
python-preference = "system"
# 关键：裸 `uv sync` 就装上 CPU 变体，不需要任何命令行参数。
# （已实测：uv 0.12.9，default-groups + sources 的 group key 均生效）
default-groups = ["dev", "torch-cpu"]
# 六个变体互斥 —— uv 需要它才能生成 universal resolution，
# 否则同包不同 index 会解析冲突。（已实测：同时给两个变体会明确报错，不静默）
conflicts = [
  [
    { group = "torch-cpu" },
    { group = "torch-cu118" },
    { group = "torch-cu126" },
    { group = "torch-cu128" },
    { group = "torch-rocm" },
    { group = "torch-xpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "torch-cpu" },
  { index = "pytorch-cu118", group = "torch-cu118" },
  { index = "pytorch-cu126", group = "torch-cu126" },
  { index = "pytorch-cu128", group = "torch-cu128" },
  { index = "pytorch-rocm", group = "torch-rocm" },
  { index = "pytorch-xpu", group = "torch-xpu" },
]
# 传递依赖也必须钉 index —— 否则 `uv lock` 直接失败（已实测 2026-09-04）：
#   torch==2.7.1+xpu   → pytorch-triton-xpu==3.3.1
#   torch==2.7.1+rocm6.3 → pytorch-triton-rocm==3.3.1
# 这两个包**只存在于各自的 PyTorch index**，PyPI 上没有。因为上面的 index 都是
# explicit = true（只服务显式钉住的包），未钉住的传递依赖会落到 PyPI → 无解 →
# "No solution found when resolving dependencies for split (sys_platform ==
# 'linux')"。CPU / cu* 变体无此问题（nvidia-* 传递依赖本来就在 PyPI 上）。
pytorch-triton-xpu = [{ index = "pytorch-xpu", group = "torch-xpu" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm", group = "torch-rocm" }]

# explicit = true：这些 index 只用于 torch，jinja2/numpy 之类仍走 PyPI。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.setuptools]
# 2026-09-02（plan/python-refactor.md B4）：此前 py-modules=[] 使 `pip install -e .`
# 装不进任何东西，各模块只能靠 sys.path hack 互相可见。现在声明包与顶层模块，
# 安装后可任意目录 `import schema / ppo / rl / models / ...`。
# 2026-09-27（S5 第十一刀）：`common.distribution` 现在 import `common.shard` /
# `common.weights_ledger` ⇒ 两者必须同栈声明，否则 editable 安装下 `import common.distribution`
# 直接 ImportError（测试靠 conftest 的 sys.path 看不出来，装机环境才现形）。
# 2026-09-30（刀 2，`common/` 收口）：五个顶层单文件（`dist_common` / `dist_shard` /
# `dist_weights_ledger` / `schema` / `platform_utils`，外加 `pid_probe`）全部搬进 `common/`
# ⇒ `py-modules` 清空。它们仍然会给 `pack_code_zip` 打进 code.zip、也仍然 `pip install -e .`
# 后可直接 import —— 但**形状从「顶层模块」变成了「`common` 包的子模块」**（`from common.schema import …`）。
py-modules = []

# 2026-09-23：新增 `common`（共享原语层，stdlib-only）——它同样要给
# `pack_code_zip` 打进 code.zip，也必须 `pip install -e .` 后可直接 `import common.*`。
# 2026-09-30（刀 2）：`common` 现在就是**全部 L0**（原根下六个单文件 + `rl/jsonc` +
# `remote/` 的三个原语都收进来了）⇒ 本清单里 `common*` 是 L0 的唯一入口。
# 层契约与「谁不能用它」见 common/__init__.py。
# 2026-09-30（刀 1）：`hub` 从 `remote/hub/` 出包成为顶层包 ⇒ 必须与 `remote*` 一样在
# 装机环境（`pip install -e .`）下可直接 `import hub.*`（测试靠 conftest 的 sys.path 看不出来）。
# `remote*` 本来就漏在清单外（今日补上）：它是云机 `code.zip` 的 sys.path 契约包之一。
# 2026-09-30（刀 3）：`worker` 从 `remote/` 出包同样要声明 —— `remote/offline_eval.py` 与
# `remote/worker.py` 都 `from worker …`，不声明则在装机环境里直接 ImportError（同上次的教训）。
# 2026-09-30（刀 4）：`biz` 从 `rl/` 出包（纯逻辑整族 64 个模块）—— `rl*` 只覆盖编排，
# 不声明 `biz*` 的话，装机环境（`pip install -e .`）里 `import biz.*` 直接 ImportError，
# 而 conftest 的 sys.path 会让测试全绿（刀 1/刀 2/刀 3 各踩过一次同型的坑）。
# 2026-09-30（刀 5）：编排那一半随整包改名 `rl*` → `trainer*`（`rl/` 这个包从此不存在）。
# 2026-09-30（刀 6）：算法栈五包（`models` / `ppo` / `data` / `train` / `scripts`）整族搬进
# `worker/` ⇒ 它们不再是顶层包，本清单里对应的五行**已删**（留着就是「清单腐烂」：装机
# 环境下 `import models` 本就不该可用，而矩阵里的空 pattern 谁也看不出来）。
# 2026-09-30（刀 7）：14 个入口脚本归位（`trainer/` · `tools/` · `remote/` · `worker/`）——
# 全部落在**已声明**的包内，故清单本身无新增；`nn-training/` 顶层从此只剩 `conftest.py`。
[tool.setuptools.packages.find]
include = [
  "trainer*",
  "biz*",
  "tools*",
  "common*",
  "remote*",
  "hub*",
  "worker*",
]

# ---------------------------------------------------------------------------
# ruff - lint + format (replaces flake8/black/isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "weights", "tmp", "__pycache__", "ipynb"]
# 2026-09-02：缓存迁到项目内 tmp/（默认在 %LOCALAPPDATA%\ruff，清理旧缓存会触发
# 沙箱删除权限请求；项目内删除无需审批）。
# 2026-09-08 双 tmp 统一：相对 cwd（=nn-training）指向 ../tmp = 仓库根 tmp/。
cache-dir = "../tmp/.ruff-cache"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "A", # flake8-builtins
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501", # line-length (handled by formatter)
  "E402", # module-level import not at top (intentional _ROOT sys.path hack)
  "RUF001", # ambiguous unicode in text (中文标点/字符在 docstring/comment 中合法)
  "RUF002", # ambiguous unicode in text (中文标点：逗号/句号在 docstring 中合法)
  "RUF003", # ambiguous unicode in text (中文标点：括号/冒号在 comment 中合法)
  "RUF012", # mutable class variable (intentional in model classes)
  "RUF059", # unused __all__ entries (may be re-exports for IDE support)
  "N806", # variable in function should be lowercase (intentional: N, B, PPO, etc.)
  "N812", # local variable should be lowercase (intentional: F for torch.nn.functional)
  "SIM105", # use contextlib.suppress (style preference, not a bug)
  "SIM115", # use context manager for file operations (style preference)
  "B023", # loop variable capture in closures (safe in immediately-called callbacks)
]
unfixable = ["F401"] # don't auto-remove unused imports (may be intentional re-exports)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"] # test imports are often re-exports for pytest discovery
# 2026-10-01：tests/ 按源码包树拆成子目录（tests/<pkg>/）后，`tests/*` 这个单层通配
# 不再覆盖子目录里的用例 —— 补一条深层通配，两层的豁免语义保持一致。
"tests/**/*" = ["F401"]
"e2e/*" = ["F401"] # same for integration/e2e suite
# 2026-09-30：`tools/tpu-probe.py` 是**带连字符的一次性 CLI 探针**，不是可导入模块
# （全仓无人 `import tpu_probe`）⇒ N999（模块命名规则）不适用。它此前一直让
# `ruff check` 返非零，于是 nn 门禁的**总体退出码常年是红的**（`Found 1 error`，内容
# 与本次改动无关）——「狼来了」久了就没人看门禁了。改名 `tpu_probe.py` 是另一条路，
# 但要动 docs / 命令行引用，不值当。
"tools/tpu-probe.py" = ["N999"]
# 2026-10-02：`tools/backtest-burn-rule.py` 同款（干烧熔断回测的一次性 CLI，全仓无人
# `import`）——它自 fa843e8f 起就在让全量 ruff 多一条 N999，本次合并按同一先例登记豁免。
"tools/backtest-burn-rule.py" = ["N999"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy - static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
# 2026-09-15：随解释器升级 3.10 → 3.12。3.12 的 numpy wheel 用了 PEP 695 `type` 语法
# （3.12+），钉 3.10 会让 mypy 对 site-packages 报假红。
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
# 2026-09-02：缓存迁到项目内 tmp/（默认 .mypy_cache 在 cwd，重建时删除旧缓存文件
# 会触发沙箱删除权限请求；tmp/ 已 gitignore，删除在项目内无需审批）。
# 2026-09-08 双 tmp 统一：相对 cwd（=nn-training）指向 ../tmp = 仓库根 tmp/。
cache_dir = "../tmp/.mypy-cache"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
exclude = ["\\.venv/", "weights/", "tmp/"]

# Third-party stubs (progressive enablement)
[[tool.mypy.overrides]]
# 2026-10-03：加 `sympy.*` —— `worker/ppo/np_core._ensure_sympy_printing` 需要在 import
# torch_xla 前探一次 sympy（它无 py.typed，静态 import 会报 import-untyped）。与 torch/numpy
# 同册：第三方无 stubs 的包一律走这条豁免，而不是在调用点撒 type: ignore。
module = ["torch.*", "numpy.*", "torch_xla.*", "sympy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# 层 = 路径（2026-09-15）：tests/ = 单测层 · e2e/ = 集成层。
# 门禁（tools/githook/nn-python-gate.sh）与 CI 都**显式传目标**：门禁跑
# `pytest tests/ e2e/`（同一次 xdist 调用，实测只 +5s），CI 分两步。
# 因此 testpaths 保持 ["tests"] —— 它只是「裸 pytest」的默认，不参与门禁判定集；
# 裸跑只收单测层，想跑集成层用 make test-e2e / 显式路径。
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short -x --timeout=60"
# 2026-09-15：全局 per-test 超时护栏（--timeout=60，用户口径：**超过 1 分钟就是有问题**）。
# 裸 `python -m pytest xxx`（编码 agent 沙箱常见）此前无任何超时，被沙箱节流的测试可拖成
# 无限卡死（实测 test_volume_topup_iterates_until_wave_cap 卡数分钟）。
# 2026-09-20：这是**挂起**护栏（兜死锁/卡死），与 `conftest.py` 的**耗时预算**护栏分工：
#   conftest（根）：>5s 警告、>30s **报错**（用户口径，2026-09-26 由 10s 抬高以抗本机 CPU 负载）；覆盖两个层（tests/ + e2e/），
#   `NN_TEST_WARN_S` / `NN_TEST_FAIL_S` / `--test-warn-s` / `--test-fail-s` 可覆盖，
#   个别确需更长的用例用 `@pytest.mark.time_budget(N)`（写明理由）。
#   引入背景：门禁墙钟 157s 里绝大部分是测试在**空等生产超时**（不占 CPU）——当时最慢单测
#   30s（4 个 26.5s）；修完实测最慢 5s，全量 157s → 24s。详见 docs/nn/engineering.md §14。
# 真的合法超 60s 的用例用 `@pytest.mark.timeout(N)` 显式放行。
# 优先级：CLI `--timeout=N` 覆盖 addopts（后者生效：门禁/task 仍是 50s）；长 e2e（真训练/
# 真 sim）显式 `--timeout=0` 关闭。局限：pytest-timeout 兜不住 C 层原生阻塞（subprocess.wait
# 等），但 Python 字节码级挂起必兜住并打印主线程栈。
# 2026-09-02：**不设 --basetemp**。pytest 每次启动会清空 basetemp（>50 文件触发
# 沙箱批量删除确认，无交互场景直接失败）。conftest 已覆盖内置 tmp_path fixture：
# 临时目录落在项目内 tmp/pytest-tmp/ 唯一子目录、从不删除——pytest 不创建 basetemp、
# 全程零删除。旧累积目录可手动清理（一次性确认）。

# NOTE: e2e/test_run_rl.py is ALSO runnable as a standalone script
# (bun dashboard/src/launch/cli.ts --script e2e/test_run_rl.py). This is
# intentional for ad-hoc regression without pytest overhead. The pytest
# collection path is the canonical CI one.
# Markers（2026-09-15：标记**不再承担分层职责** —— 层由路径决定，tests/ = 单测层、
# e2e/ = 集成层；全仓已无 `-m "not heavy"` 调用方，原 tests/ 里 heavy 标记实测 0 个。
# 保留注册只为「将来再引入标记时不报 unknown marker」，不要在 gate/CI 里拿它分层）：
markers = [
  "heavy: (legacy, 无人过滤) 重型/集成用例的说明性标记",
  "slow: (legacy, 无人过滤) 慢用例的说明性标记",
]
