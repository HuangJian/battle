[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battle2-nn-training"
version = "0.1.0"
description = "Battle City Web - NN player AI training workspace (PyTorch / CPU-only)"
requires-python = ">=3.10,<3.14"
dependencies = ["torch>=2.7.1", "numpy>=2.1.3"]

[project.optional-dependencies]
dev = ["ruff>=0.6.0", "mypy>=1.11.0", "pytest>=8.0.0"]

[tool.setuptools]
py-modules = []

# ---------------------------------------------------------------------------
# ruff - lint + format (replaces flake8/black/isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "weights", "tmp", "__pycache__"]

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "A", # flake8-builtins
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501", # line-length (handled by formatter)
  "E402", # module-level import not at top (intentional _ROOT sys.path hack)
  "RUF001", # ambiguous unicode in text (中文标点/字符在 docstring/comment 中合法)
  "RUF002", # ambiguous unicode in text (中文标点：逗号/句号在 docstring 中合法)
  "RUF003", # ambiguous unicode in text (中文标点：括号/冒号在 comment 中合法)
  "RUF012", # mutable class variable (intentional in model classes)
  "RUF059", # unused __all__ entries (may be re-exports for IDE support)
  "N806", # variable in function should be lowercase (intentional: N, B, PPO, etc.)
  "N812", # local variable should be lowercase (intentional: F for torch.nn.functional)
  "SIM105", # use contextlib.suppress (style preference, not a bug)
  "SIM115", # use context manager for file operations (style preference)
  "B023", # loop variable capture in closures (safe in immediately-called callbacks)
]
unfixable = ["F401"] # don't auto-remove unused imports (may be intentional re-exports)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"] # test imports are often re-exports for pytest discovery

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy - static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
exclude = ["\\.venv/", "weights/", "tmp/"]

# Third-party stubs (progressive enablement)
[[tool.mypy.overrides]]
module = ["torch.*", "numpy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short -x"

# NOTE: tests/test_run_rl.py is ALSO runnable as a standalone script
# (python tests/test_run_rl.py). This is intentional for ad-hoc regression
# without pytest overhead. The pytest collection path is the canonical CI one.
# Markers:
#   @pytest.mark.heavy  → excluded from fast-gate (integration / torch training)
markers = [
  "heavy: marks tests that require the heavy test gate (torch full-train, integration)",
  "slow: marks slow tests (full determinism corpus)",
]
