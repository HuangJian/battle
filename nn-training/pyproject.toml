[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battle2-nn-training"
version = "0.1.0"
description = "Battle City Web - NN player AI training workspace (PyTorch)"
requires-python = ">=3.10,<3.14"
# torch 刻意不在主依赖里：它只存在于下方互斥的 dependency-groups 变体中，由
# bootstrap.py 按机器探测结果选一个装。
#
# 为什么：把 torch 写进主依赖又不配 index，Linux/Windows 上 pip 会从 PyPI 拉
# 默认 CUDA 构建（连带 nvidia-* 依赖，~3GB）—— 与原来的 CPU 口径正面冲突。
# 为什么用 dependency-groups 而不是 optional-dependencies：后者会被 setuptools
# 消费，`pip install .[cpu]` 会无视 [tool.uv.sources] 从 PyPI 拉 CUDA 构建，
# 等于把同一个坑换个地方再踩一次；dependency-groups（PEP 735）只有 uv 认，
# setuptools 完全无视。详见 plan/python-env-bootstrap-and-device.md §3.2。
dependencies = ["numpy>=2.1.3", "pydantic>=2.13"]

# dev 工具链（PEP 735）
[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "pytest-xdist>=3.6",    # Makefile `pytest -n 4` 与 tools/githook/nn-python-gate.sh 依赖
  "pytest-timeout>=2.3",  # task.py `--timeout=50000` 依赖
]

# torch 变体：互斥，须且只须选一个。变体名 → index 映射见 [tool.uv.sources]，
# 选择逻辑在 bootstrap.py。
#
# 变体清单是 2026-09-04 实测 download.pytorch.org 得出的（针对 torch 2.7.1）：
#   cpu / cu118 / cu126 / cu128 / xpu → Win + Linux 有构建
#   rocm6.3                            → 仅 Linux
#   cu124 / cu130                      → 无 2.7.1 构建（属其它 torch 版本），不设
# macOS 无 GPU 变体 → Darwin 上一律用 torch-cpu（Apple Silicon 的 MPS 由 PyPI
# 原生 wheel 提供，无需特殊 index）。
torch-cpu = ["torch==2.7.1"]
torch-cu118 = ["torch==2.7.1"]
torch-cu126 = ["torch==2.7.1"]
torch-cu128 = ["torch==2.7.1"]
# 注意：triton 只随 Linux wheel 发布，故带 sys_platform 标记——否则 universal
# resolution 在 Windows split 上找不到 wheel 会直接失败。
torch-rocm = ["torch==2.7.1", "pytorch-triton-rocm==3.3.1 ; sys_platform == 'linux'"]
torch-xpu = ["torch==2.7.1", "pytorch-triton-xpu==3.3.1 ; sys_platform == 'linux'"]

# ---------------------------------------------------------------------------
# uv — 环境与变体解析
# ---------------------------------------------------------------------------
[tool.uv]
# system = 优先用机器上已有的解释器（满足 requires-python 即可），没有才回退到
# uv 托管的下载版。实测（2026-09-04）：设成 managed 时 uv 会用 3.13.12 把本机
# 现役 venv（pyenv 3.10.5 + torch 2.7.1+cpu）整个 "Would replace project
# environment" 重建一遍——纯属无谓破坏。requires-python 已把范围钉在
# 3.10–3.13，用系统解释器完全够，冷机器上没 python 时仍会自动下载托管的。
python-preference = "system"
# 关键：裸 `uv sync` 就装上 CPU 变体，不需要任何命令行参数。
# （已实测：uv 0.12.9，default-groups + sources 的 group key 均生效）
default-groups = ["dev", "torch-cpu"]
# 六个变体互斥 —— uv 需要它才能生成 universal resolution，
# 否则同包不同 index 会解析冲突。（已实测：同时给两个变体会明确报错，不静默）
conflicts = [
  [
    { group = "torch-cpu" },
    { group = "torch-cu118" },
    { group = "torch-cu126" },
    { group = "torch-cu128" },
    { group = "torch-rocm" },
    { group = "torch-xpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "torch-cpu" },
  { index = "pytorch-cu118", group = "torch-cu118" },
  { index = "pytorch-cu126", group = "torch-cu126" },
  { index = "pytorch-cu128", group = "torch-cu128" },
  { index = "pytorch-rocm", group = "torch-rocm" },
  { index = "pytorch-xpu", group = "torch-xpu" },
]
# 传递依赖也必须钉 index —— 否则 `uv lock` 直接失败（已实测 2026-09-04）：
#   torch==2.7.1+xpu   → pytorch-triton-xpu==3.3.1
#   torch==2.7.1+rocm6.3 → pytorch-triton-rocm==3.3.1
# 这两个包**只存在于各自的 PyTorch index**，PyPI 上没有。因为上面的 index 都是
# explicit = true（只服务显式钉住的包），未钉住的传递依赖会落到 PyPI → 无解 →
# "No solution found when resolving dependencies for split (sys_platform ==
# 'linux')"。CPU / cu* 变体无此问题（nvidia-* 传递依赖本来就在 PyPI 上）。
pytorch-triton-xpu = [{ index = "pytorch-xpu", group = "torch-xpu" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm", group = "torch-rocm" }]

# explicit = true：这些 index 只用于 torch，jinja2/numpy 之类仍走 PyPI。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.setuptools]
# 2026-09-02（plan/python-refactor.md B4）：此前 py-modules=[] 使 `pip install -e .`
# 装不进任何东西，各模块只能靠 sys.path hack 互相可见。现在声明包与顶层模块，
# 安装后可任意目录 `import schema / ppo / rl / models / ...`。
py-modules = ["dist_common", "schema", "platform_utils"]

[tool.setuptools.packages.find]
include = ["models*", "ppo*", "rl*", "data*", "train*", "scripts*", "tools*"]

# ---------------------------------------------------------------------------
# ruff - lint + format (replaces flake8/black/isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "weights", "tmp", "__pycache__", "ipynb"]
# 2026-09-02：缓存迁到项目内 tmp/（默认在 %LOCALAPPDATA%\ruff，清理旧缓存会触发
# 沙箱删除权限请求；项目内删除无需审批）。
cache-dir = "tmp/.ruff-cache"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "A", # flake8-builtins
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501", # line-length (handled by formatter)
  "E402", # module-level import not at top (intentional _ROOT sys.path hack)
  "RUF001", # ambiguous unicode in text (中文标点/字符在 docstring/comment 中合法)
  "RUF002", # ambiguous unicode in text (中文标点：逗号/句号在 docstring 中合法)
  "RUF003", # ambiguous unicode in text (中文标点：括号/冒号在 comment 中合法)
  "RUF012", # mutable class variable (intentional in model classes)
  "RUF059", # unused __all__ entries (may be re-exports for IDE support)
  "N806", # variable in function should be lowercase (intentional: N, B, PPO, etc.)
  "N812", # local variable should be lowercase (intentional: F for torch.nn.functional)
  "SIM105", # use contextlib.suppress (style preference, not a bug)
  "SIM115", # use context manager for file operations (style preference)
  "B023", # loop variable capture in closures (safe in immediately-called callbacks)
]
unfixable = ["F401"] # don't auto-remove unused imports (may be intentional re-exports)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"] # test imports are often re-exports for pytest discovery

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy - static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
# 2026-09-02：缓存迁到项目内 tmp/（默认 .mypy_cache 在 cwd，重建时删除旧缓存文件
# 会触发沙箱删除权限请求；tmp/ 已 gitignore，删除在项目内无需审批）。
cache_dir = "tmp/.mypy-cache"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
exclude = ["\\.venv/", "weights/", "tmp/"]

# Third-party stubs (progressive enablement)
[[tool.mypy.overrides]]
module = ["torch.*", "numpy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short -x"
# 2026-09-02：**不设 --basetemp**。pytest 每次启动会清空 basetemp（>50 文件触发
# 沙箱批量删除确认，无交互场景直接失败）。conftest 已覆盖内置 tmp_path fixture：
# 临时目录落在项目内 tmp/pytest-tmp/ 唯一子目录、从不删除——pytest 不创建 basetemp、
# 全程零删除。旧累积目录可手动清理（一次性确认）。

# NOTE: tests/test_run_rl.py is ALSO runnable as a standalone script
# (python tests/test_run_rl.py). This is intentional for ad-hoc regression
# without pytest overhead. The pytest collection path is the canonical CI one.
# Markers:
#   @pytest.mark.heavy  → excluded from fast-gate (integration / torch training)
markers = [
  "heavy: marks tests that require the heavy test gate (torch full-train, integration)",
  "slow: marks slow tests (full determinism corpus)",
]
