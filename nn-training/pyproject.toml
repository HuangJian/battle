[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battle2-nn-training"
version = "0.1.0"
description = "Battle City Web - NN player AI training workspace (PyTorch / CPU-only)"
requires-python = ">=3.10,<3.14"
dependencies = ["torch>=2.7.1", "numpy>=2.1.3"]

[project.optional-dependencies]
dev = ["ruff>=0.6.0", "mypy>=1.11.0", "pytest>=8.0.0"]

[tool.setuptools]
py-modules = []

# ---------------------------------------------------------------------------
# ruff - lint + format (replaces flake8/black/isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "weights", "tmp", "__pycache__"]

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "A", # flake8-builtins
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501", # line-length (handled by formatter)
  "RUF002", # ambiguous unicode in text (中文标点：逗号/句号在 docstring 中合法)
  "RUF003", # ambiguous unicode in text (中文标点：括号/冒号在 comment 中合法)
  "SIM108", # if-else-block-instead-of-if-explicit-exit (opinion)
]
unfixable = ["F401"] # don't auto-remove unused imports (may be intentional re-exports)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy - static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
exclude = ["\\.venv/", "weights/", "tmp/"]

# Third-party stubs (progressive enablement)
[[tool.mypy.overrides]]
module = ["torch.*", "numpy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short"
