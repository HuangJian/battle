# CI for nn-training: lint + typecheck + fast tests
# Integration tests (RUN_RL_ITEST=1) require bun + weights fixture - skipped in CI.
name: nn-training

on:
  push:
    branches: [main, master]
    paths:
      - 'nn-training/**'
      - '.github/workflows/nn-training.yml'
  pull_request:
    paths:
      - 'nn-training/**'
      - '.github/workflows/nn-training.yml'

concurrency:
  group: nn-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nn-training
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # uv.lock 是 universal lock（含全部 6 个 torch 变体），任何机器/任何变体
          # 都能离线复现。cache 以 lock 文件为键 —— requirements.txt 已删。
          enable-cache: true
          cache-dependency-glob: nn-training/uv.lock

      - name: Sync env (CPU torch + dev tools)
        # 裸 `uv sync` = default-groups (dev + torch-cpu)。CI runner 无 GPU，
        # 装 CPU 变体；有 GPU 的自托管 runner 走 `uv sync --no-default-groups
        # --group dev --group torch-cu128`。
        run: uv sync --frozen

      - name: ruff lint
        run: uv run ruff check . --config pyproject.toml

      - name: mypy typecheck
        run: uv run mypy . --config-file pyproject.toml
        continue-on-error: true # baseline: 121 pre-existing errors; reported not blocked

      - name: fast test layer
        run: |
          uv run pytest tests/ -v -q --no-header
          uv run python test_run_rl.py
