# CI for nn-training: lint + typecheck + fast tests
# Integration tests (RUN_RL_ITEST=1) require bun + weights fixture - skipped in CI.
name: nn-training

on:
  push:
    branches: [main, master]
    paths:
      - 'nn-training/**'
      - '.github/workflows/nn-training.yml'
  pull_request:
    paths:
      - 'nn-training/**'
      - '.github/workflows/nn-training.yml'

concurrency:
  group: nn-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nn-training
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: nn-training/requirements.txt

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev deps (ruff + mypy + pytest)
        run: pip install "ruff>=0.6.0" "mypy>=1.11.0" "pytest>=8.0.0"

      - name: ruff lint
        run: ruff check . --config pyproject.toml

      - name: mypy typecheck
        run: mypy . --config-file pyproject.toml
        continue-on-error: true # baseline: 121 pre-existing errors; reported not blocked

      - name: fast test layer
        run: |
          pytest tests/ -v -q --no-header
          python test_run_rl.py
