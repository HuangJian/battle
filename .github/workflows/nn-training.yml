# CI for nn-training: lint + typecheck + unit tests + e2e tests
# 2026-09-15：旧的「Integration tests (RUN_RL_ITEST=1) require bun + weights
# fixture - skipped in CI」说明**已过期**。e2e/ 自 60e5f69 起是 hermetic 的
# （FakeServer + tmp 落盘；不需要 bun / 真节点 / weights fixture，实测把 bun 从
# PATH 摘掉仍 70 例全绿），因此它现在是 CI 的一等层。
name: nn-training

on:
  push:
    branches: [main, master]
    paths:
      - 'nn-training/**'
      - '.github/workflows/nn-training.yml'
  pull_request:
    paths:
      - 'nn-training/**'
      - '.github/workflows/nn-training.yml'

concurrency:
  group: nn-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nn-training
    # CPU 内线程封顶（与本机 python-gate 同一套旋钮、同一个值）：
    # xdist 每个 worker 默认继承 torch 的内线程数（= 核数），worker 一多就超订。
    # 本机 16 核实测 `-n 12`：默认线程 44.7s → 封 1 线程 24.7s；
    # 用 `taskset -c 0,1` 把本机压成 2 vCPU 模拟本 job（`-n 2`）：默认 57/73s → 封顶 55/53s
    # （收益小但方差明显更小）。0 = 不设（退回 torch 默认）；实测推理见
    # tools/githook/nn-python-gate.sh 头注。
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # uv.lock 是 universal lock（含全部 6 个 torch 变体），任何机器/任何变体
          # 都能离线复现。cache 以 lock 文件为键 —— requirements.txt 已删。
          enable-cache: true
          cache-dependency-glob: nn-training/uv.lock

      - name: Sync env (CPU torch + dev tools)
        # 裸 `uv sync` = default-groups (dev + torch-cpu)。CI runner 无 GPU，
        # 装 CPU 变体；有 GPU 的自托管 runner 走 `uv sync --no-default-groups
        # --group dev --group torch-cu128`。
        run: uv sync --frozen

      - name: ruff lint
        run: uv run ruff check . --config pyproject.toml

      # 2026-09-15：原为 `continue-on-error: true` + 一句注释里的错误数快照。
      # 那个数字是 733b66f（首次加 CI）时的快照，此后 mypy 目标升到 3.12（正是那次
      # 消灭了大批 site-packages 假红）+ 几处放宽，真实错误数一路降到 1；最后一条
      # （biz/reward_library.py 的 no-any-return）也已修掉 ⇒ 现在要求**零错误**。
      # 零容忍比「计数基线」更强（换一个错误也算红），也不再要一份会腐烂的数字。
      # **不要再加 continue-on-error** —— 那等于把会腐烂的基线又请回来。
      - name: mypy typecheck
        run: uv run mypy . --config-file pyproject.toml

      # 层 = 路径：tests/ 单测层、e2e/ 集成层（本机 python-gate 同一划分）。
      # 旧版末步是 `uv run python test_run_rl.py` —— cwd 是 nn-training，而该文件在
      # 60e5f69 已被搬到 e2e/，于是这一步自那以后每跑必挂（且无 continue-on-error）。
      # 其覆盖已包含在下面的 e2e 层里（pytest 收集同一批用例）。
      # 并行度（2026-10-03）：worker = 本机**物理核数**，由 `tools/nproc.py` 在 runner 上现探
      # （口径 = common.platform_utils.physical_cores：真物理核 ∧ cgroup 配额 ∧ 亲和掩码取小；
      # 与本机门禁脚本 / tools/task.py / Makefile 同一口径）。此前是写死的 `-n 2`（按 runner
      # 规模估的），改成现探后 runner 换规格不必再改文件。
      # 为什么在 CI 里探而不是 `-n auto`：`-n auto` 是 **xdist 自己**解析的（逻辑核/亲和掩码），
      # 看不见我们的物理核口径。
      # ⚠ **不要给 CI 换 `--forkdist`**（2026-09-29 实测，docs/nn/engineering.md §50）：
      # `-p tools.forkdist --forkdist 2` 在本仓的 runner 规模下**没有墙钟收益**
      # （taskset 模拟 2 vCPU：45.03 vs 44.95s；4 vCPU：40.93 vs 41.51s；e2e 层两边互有
      # 胜负、都在 ±0.7s 噪声内）。那份收益来自「多 worker 重复收集」的**争用缓解**，
      # runner 只有 2 个 worker，没什么可缓解的（CPU 仍降 ~12%，但不换墙钟）。
      - name: resolve worker count (physical cores)
        id: cores
        shell: bash
        # 落文件再读：`uv run python tools/nproc.py` 后面**必须跟空白** ——
        # `tests/test_ci_workflow_paths.py` 的 `_UV_RUN_PY`（`\S+`）会把紧跟在路径后的
        # `)` 也当成路径的一部分，于是「CI 引用了不存在的路径」假红。
        run: |
          uv run python tools/nproc.py > "$RUNNER_TEMP/nproc.txt"
          echo "n=$(cat "$RUNNER_TEMP/nproc.txt")" >> "$GITHUB_OUTPUT"

      - name: unit layer (tests/)
        run: uv run pytest tests/ -n "${{ steps.cores.outputs.n }}" -q --no-header

      - name: e2e layer (e2e/)
        # worker 数同单测层（现探物理核数，不是为了绕 flake）。备注：仓库记录过的
        # test_bc_epoch_e2e 负载型 flake（docs/nn.progress.md §313）已于 2026-09-15 修
        # 根因（该测试只等 bc_epoch 就回 result，漏等了随后断言的 bc_eval）。
        run: uv run pytest e2e/ -n "${{ steps.cores.outputs.n }}" -q
