<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle City Web — Performance Harness</title>
    <style>
      :root {
        --cream: #fff7e6;
        --yellow: #f4c430;
        --brick: #e07a5f;
        --ink: #2b2b2b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: linear-gradient(180deg, #fff7e6, #fce3b4);
        color: var(--ink);
        font-family: 'Noto Sans SC', system-ui, sans-serif;
      }
      #game-root {
        width: 100%;
        height: calc(100% - 0px);
      }
      #perf-panel {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 340px;
        background: rgba(255, 247, 230, 0.96);
        border: 1.5px solid var(--ink);
        border-radius: 18px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        padding: 14px 16px;
        z-index: 9999;
        font-size: 13px;
      }
      #perf-panel h1 {
        font-size: 15px;
        margin: 0 0 10px;
        font-family: 'Fredoka', sans-serif;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 12px;
        border: 1.5px solid var(--ink);
        background: var(--yellow);
        color: var(--ink);
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.05);
      }
      #readout {
        background: #fffdf7;
        border: 1px solid rgba(43, 43, 43, 0.15);
        border-radius: 12px;
        padding: 10px;
        margin: 0;
        white-space: pre-wrap;
        line-height: 1.45;
        font-family: 'Courier New', monospace;
        font-size: 12px;
      }
      #verdict {
        margin-top: 8px;
        font-weight: 700;
      }
      #verdict.ok {
        color: #1a7f37;
      }
      #verdict.warn {
        color: #b3261e;
      }
      .hint {
        color: #6b6b6b;
        font-size: 11px;
        line-height: 1.4;
        margin: 10px 0 0;
      }
      code {
        background: rgba(43, 43, 43, 0.08);
        padding: 1px 4px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/perf/browser-harness.ts"></script>
  </body>
</html>
